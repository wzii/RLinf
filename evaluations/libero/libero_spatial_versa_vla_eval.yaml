defaults:
  - env/libero_spatial@env.eval
  - model/versa_vla@rollout.model
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout: all

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_spatial_versa_vla_eval"
    logger_backends: ["tensorboard"]

  max_epochs: 1
  max_steps: -1

  only_eval: True
  val_check_interval: -1
  save_interval: -1

  resume_dir: null
  ckpt_path: null

env:
  group_name: "EnvGroup"

  eval:
    rollout_epoch: 1
    total_num_envs: 50           # start small for the OOM check; bump to 500 for full eval
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    group_size: 1
    use_fixed_reset_state_ids: True
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_spatial
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: "/path/to/model/versa_vla"   # VersaVLA0 HF checkpoint dir
    model_type: "versa_vla"
    num_action_chunks: 10
    action_dim: 7
    denoise_steps: 5
    versa_vla:
      repo_id: "libero_all_pi_v3.0"
      data_mixture_name: "LIBERO-ALL-PI_3.0"
      target_action_space: "delta"
      precision_preset: "bf16"
