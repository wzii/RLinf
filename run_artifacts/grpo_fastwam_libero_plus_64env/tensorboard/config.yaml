env:
  train:
    env_type: libero
    task_suite_name: libero_spatial
    total_num_envs: 64
    auto_reset: false
    ignore_terminations: false
    max_steps_per_rollout_epoch: 120
    max_episode_steps: 120
    use_rel_reward: true
    use_step_penalty: false
    reward_coef: 1.0
    reset_gripper_open: true
    is_eval: false
    seed: 0
    group_size: 8
    use_fixed_reset_state_ids: true
    use_ordered_reset_state_ids: false
    specific_reset_id: null
    video_cfg:
      save_video: true
      info_on_video: true
      video_base_dir: /workspace/RLinf/logs/grpo_fastwam/video/train
    init_params:
      camera_heights: 256
      camera_widths: 256
    rollout_epoch: 1
    libero_variant: plus
    perturbation_suffix: all
  eval:
    env_type: libero
    task_suite_name: libero_spatial
    total_num_envs: 4
    auto_reset: true
    ignore_terminations: true
    max_steps_per_rollout_epoch: 120
    max_episode_steps: 120
    use_rel_reward: true
    use_step_penalty: false
    reward_coef: 1.0
    reset_gripper_open: true
    is_eval: true
    seed: 0
    group_size: 1
    use_fixed_reset_state_ids: true
    use_ordered_reset_state_ids: true
    specific_reset_id: null
    video_cfg:
      save_video: false
      info_on_video: true
      video_base_dir: /workspace/RLinf/logs/grpo_fastwam/video/train
    init_params:
      camera_heights: 256
      camera_widths: 256
    rollout_epoch: 1
    libero_variant: plus
    perturbation_suffix: all
  group_name: EnvGroup
actor:
  model:
    model_type: fastwam
    precision: bf16
    model_path: /workspace/checkpoints/fastwam/libero_uncond_2cam224.pt
    is_lora: false
    checkpoint_path: /workspace/checkpoints/fastwam/libero_uncond_2cam224.pt
    dataset_stats_path: /workspace/checkpoints/fastwam/libero_uncond_2cam224_dataset_stats.json
    action_dim: 7
    num_action_chunks: 10
    action_horizon: 32
    num_inference_steps: 10
    binarize_gripper: true
    text_cfg_scale: 1.0
    negative_prompt: ''
    sigma_shift: null
    seed: null
    rand_device: cpu
    tiled: false
    add_value_head: false
    rl:
      enabled: true
      noise_level: 0.1
      noise_method: flow_sde
      freeze_video_expert: true
      train_video_expert: false
      batched: true
    fastwam:
      config_dir: null
      config_name: sim_libero
      overrides:
      - model.redirect_common_files=false
  fsdp_config:
    strategy: fsdp2
    sharding_strategy: full_shard
    gradient_checkpointing: true
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: true
    use_liger_kernel: false
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: bf16
      buffer_dtype: bf16
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
      init_scale: null
      growth_interval: null
    gradient_checkpointing_use_reentrant: true
    wrap_policy:
      no_split_names:
      - __none__
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 8
  global_batch_size: 64
  seed: 1234
  enable_offload: true
  optim:
    lr: 3.0e-05
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 100.0
    critic_warmup_steps: 0
weight_syncer:
  type: patch
  patch:
    snapshot_device: cpu
    delta_encoding: true
    compression: none
    init_sync:
      enabled: true
      prefixes: null
      bucket_size: 134217728
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all
runner:
  task_type: embodied
  logger:
    log_path: /workspace/RLinf/logs/grpo_fastwam
    project_name: rlinf
    experiment_name: libero_plus_grpo_fastwam
    logger_backends:
    - tensorboard
  max_epochs: 50
  max_steps: -1
  only_eval: false
  val_check_interval: -1
  save_interval: 100000
  resume_dir: null
  ckpt_path: null
  per_worker_log: false
  per_worker_log_path: null
  weight_sync_interval: 1
  overlap_env_bootstrap: false
algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 8
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 1
  adv_type: grpo
  loss_type: actor
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: true
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: true
  pipeline_stage_num: 1
  model:
    model_path: /workspace/checkpoints/fastwam/libero_uncond_2cam224.pt
    precision: bf16
reward:
  use_reward_model: false
critic:
  use_critic_model: false
