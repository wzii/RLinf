# FastWAM critic-free GRPO on LIBERO-Plus spatial (flow-SDE actor, NO critic).
#
# Same recipe as libero_spatial_grpo_fastwam.yaml but on the LIBERO-Plus perturbed
# variant of the spatial suite (libero_variant=plus, perturbation_suffix=all).
# Only the ~1B action expert (+ proprio) is trained; the 5B video expert is frozen.
#   bash examples/embodiment/run_embodiment.sh libero_plus_spatial_grpo_fastwam
defaults:
  - env/libero_spatial@env.train
  - env/libero_spatial@env.eval
  - model/fastwam_rl@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_plus_spatial_grpo_fastwam"
    logger_backends: ["tensorboard"]
  max_epochs: 1000
  max_steps: -1
  only_eval: False
  val_check_interval: 10     # in-process eval every 10 RL steps (live weights)
  save_interval: -1          # ckpt OFF: 46-86GB RLinf ckpts dont fit 159G disk; eval(in-proc) is the result
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 8
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level

  update_epoch: 1
  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: True
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"
  train:
    rollout_epoch: 1
    total_num_envs: 64
    group_size: ${algorithm.group_size}
    max_episode_steps: 120
    max_steps_per_rollout_epoch: 120
    reward_coef: ${algorithm.reward_coef}
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: False
    libero_variant: plus
    perturbation_suffix: language
  eval:
    rollout_epoch: 5     # 20 envs x 5 = 100 episodes (10 trials x 10 tasks); small alloc <= train
    total_num_envs: 20
    group_size: 1
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    auto_reset: True
    ignore_terminations: True
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    is_eval: True
    libero_variant: plus
    perturbation_suffix: language
    video_cfg:
      save_video: False

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 8
  global_batch_size: 64
  seed: 1234
  enable_offload: True

  model:
    model_type: "fastwam"
    num_action_chunks: 10
    add_value_head: False

  optim:
    lr: 3.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 100.0
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp2"
    use_orig_params: True
    gradient_checkpointing: True
    gradient_checkpointing_use_reentrant: True
    reshard_after_forward: True
    wrap_policy:
      no_split_names: ["__none__"]
    save_full_model_weights: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
