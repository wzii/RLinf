# FastWAM critic-free GRPO on standard LIBERO-spatial (flow-SDE actor, NO critic).
#
# Same recipe as libero_plus_grpo_fastwam.yaml but on the *unperturbed* libero_spatial
# suite. GRPO is the recommended RL for FastWAM (critic-free; group-relative advantages
# from env reward). Only the ~1B action expert (+ proprio) is trained; the 5B video
# expert is frozen. Launch:
#   bash examples/embodiment/run_embodiment.sh libero_spatial_grpo_fastwam
defaults:
  - env/libero_spatial@env.train
  - env/libero_spatial@env.eval
  - model/fastwam_rl@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_spatial_grpo_fastwam"
    logger_backends: ["tensorboard"]
  max_epochs: 1000
  max_steps: -1
  only_eval: False
  val_check_interval: 10     # in-process eval every 10 RL steps (live weights)
  save_interval: 50          # one final ckpt (46GB each; cant retain every-10 on 159G disk)
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 8              # group-relative advantage over 8 same-init rollouts
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level

  update_epoch: 1
  recompute_logprobs: False  # standard GRPO: old = rollout's behavior logprob (like openpi/gr00t), not actor's own detach
  adv_type: grpo            # critic-free
  loss_type: actor         # no value loss
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: True
  rewards_lower_bound: 0.05
  rewards_upper_bound: 0.95

env:
  group_name: "EnvGroup"
  train:
    # 128 trajectories/step (rollout_epoch 1 * total_num_envs 128).
    # total_num_envs // #GPUs(4) // pipeline_stage_num(1) = 32, divisible by group_size(8)
    # -> 4 groups of 8 per GPU (32 envs/GPU).
    rollout_epoch: 4
    total_num_envs: 32
    group_size: ${algorithm.group_size}
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240   # divisible by num_action_chunks(10)
    reward_coef: ${algorithm.reward_coef}
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: False
  eval:
    # 100 eval episodes (10 trials x 10 tasks), ordered fixed init states.
    rollout_epoch: 25    # 20 envs x 25 = 500 episodes (50 trials x 10 tasks) FULL eval
    total_num_envs: 20
    group_size: 1
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    auto_reset: True
    ignore_terminations: True
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    is_eval: True
    video_cfg:
      save_video: False

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  return_logprobs: True       # emit the behavior-policy logprob from rollout as GRPO "old"
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  # 128 envs = full GRPO batch. gbs=128 -> one full-batch update/step over all
  # 128 trajectories (like the 64-env reference's gbs=64). mbs=4 for memory margin
  # (whole-model FSDP all-gather + resident rollout buffer is tight at 128 envs).
  # gb % (mbs*gpus)==0 -> 128 % (4*4)=0.
  micro_batch_size: 8
  global_batch_size: 128
  seed: 1234
  enable_offload: True

  model:
    model_type: "fastwam"
    num_action_chunks: 10
    add_value_head: False    # critic-free GRPO

  optim:
    lr: 2.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 20.0
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp2"
    use_orig_params: True
    gradient_checkpointing: True
    gradient_checkpointing_use_reentrant: True
    # NVLink box (NV12, ~300 GB/s): the whole-model all-gather is cheap, so reshard
    # after forward to free memory for a larger micro/global batch.
    reshard_after_forward: True
    # Whole-model FSDP2 wrap: the MoT's manual cross-expert attention reaches into
    # DiT-block internals, which is incompatible with per-block auto-wrap.
    wrap_policy:
      no_split_names: ["__none__"]
    # Save the directly-loadable consolidated model weights (full_weights.pt) each
    # checkpoint; a background pruner drops the large optimizer DCP + old ckpts.
    save_full_model_weights: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
